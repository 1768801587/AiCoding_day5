<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mingle — 一个轻量的本地社交动态页面" />
  <title>Mingle · 分享此刻</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="bg-orb bg-orb--one" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--two" aria-hidden="true"></div>

  <main class="app">
    <header class="app__header">
      <h1 class="app__title">
        <span class="app__logo" aria-hidden="true">M</span>
        Mingle
      </h1>
      <p class="app__subtitle">记录当下，分享此刻</p>
    </header>

    <section class="composer" aria-label="发布动态">
      <label class="composer__label" for="postText">此刻在想什么？</label>
      <textarea
        id="postText"
        class="composer__input"
        rows="3"
        maxlength="500"
        placeholder="写下你的动态…"
      ></textarea>
      <div class="composer__footer">
        <span class="composer__count" id="charCount">0 / 500</span>
        <button type="button" class="composer__submit" id="publishBtn">发布</button>
      </div>
    </section>

    <section class="feed" aria-label="动态列表">
      <div class="feed__head">
        <h2 class="feed__title">最新动态</h2>
        <span class="feed__count" id="postCount">0 条</span>
      </div>
      <ul class="feed__list" id="postList"></ul>
      <div class="empty" id="emptyState" hidden>
        <div class="empty__icon" aria-hidden="true">✦</div>
        <p class="empty__text">还没有动态，发布第一条吧～</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
